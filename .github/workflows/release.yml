# Baut bei jedem Versions-Tag (v0.17.0) die .vsix und hängt sie an das GitHub-Release.
# Der Updater in der Erweiterung findet sie dort über /releases/latest.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag und package.json müssen zusammenpassen
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      - name: Release anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="ftp-buddy-$VERSION.vsix"
          test -f "$file"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          else
            # actions/checkout holds an annotated tag as a plain one; fetching it again brings the text back
            git fetch --tags --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
            gh release create "$GITHUB_REF_NAME" "$file" --title "$GITHUB_REF_NAME" --notes "${notes:-Version $VERSION}"
          fi
